services:
  postgres:
    image: postgres:16
    container_name: salon-postgres
    environment:
      POSTGRES_DB: salon_explorer
      POSTGRES_USER: cem1234
      POSTGRES_PASSWORD: cem1234
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: